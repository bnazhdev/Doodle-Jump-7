<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Прыг-Тетрадь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Neucha&family=Rubik:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one full-window notebook board; menus float as paper cards over it */
:root{
  --desk:#cfdad5; --paper:#f5f8f6; --grid:#d3e2dc; --margin:#e48c86;
  --ink:#1c2836; --ink-soft:#5a6a7c; --hi:#ffe14d; --line:#c3d3cc; --ok:#2e8b57; --bad:#b3261e;
  --red:#d1342f; --blue:#2b59c3;
  --f-display:"Neucha","Comic Sans MS",cursive;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Segoe UI Symbol",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;background:rgba(207,218,213,.35);backdrop-filter:blur(1.5px);z-index:4}
.card{width:100%;max-width:460px;margin:auto;background:var(--paper);border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);padding:22px;display:flex;flex-direction:column;gap:14px}
.card.wide{max-width:980px}.card.mid{max-width:600px}
.title{font-family:var(--f-display);font-size:56px;line-height:.95;margin:0;font-weight:400}
.title span{background:linear-gradient(transparent 55%,var(--hi) 55%,var(--hi) 90%,transparent 90%);padding:0 4px}
.card h2{font-family:var(--f-display);font-size:32px;line-height:1.1;margin:0;font-weight:400;text-wrap:balance}
.card h3{font-family:var(--f-display);font-size:22px;line-height:1.1;margin:0;font-weight:400}
.card p{margin:0;color:var(--ink-soft)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr) minmax(0,1fr);gap:24px}
@media (max-width:940px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cols>.help{grid-column:1/-1}}
@media (max-width:620px){.cols{grid-template-columns:minmax(0,1fr)}.title{font-size:42px}}
.btn{font:600 15px var(--f-body);border:2px solid var(--ink);border-radius:6px;padding:11px 14px;cursor:pointer;background:var(--ink);color:var(--paper);box-shadow:3px 3px 0 var(--hi)}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--hi)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:none}
.btn.sm{padding:6px 10px;font-size:13px;box-shadow:none}
.btn:focus-visible,input:focus-visible,.sw:focus-visible,.tool:focus-visible,.av:focus-visible,.seg button:focus-visible,.shopitem:focus-visible,.rb:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:12px;color:var(--ink-soft)}
.field input{font:16px var(--f-body);color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--ink);padding:5px 2px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.avatars{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.av{aspect-ratio:1;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);font:22px var(--f-emoji);cursor:pointer;padding:0;display:grid;place-items:center}
.av[aria-pressed="true"]{border:2px solid var(--ink);background:var(--hi)}
#code{font:700 34px var(--f-mono);letter-spacing:.35em;text-align:center;border:2px solid var(--ink);border-radius:8px;padding:8px 0 8px .35em;background:#fff;width:100%;color:var(--ink)}
#code::placeholder{color:var(--line)}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:12px}.or::before,.or::after{content:"";flex:1;border-top:1px dashed var(--line)}
.roomcode{font:700 64px/1 var(--f-mono);letter-spacing:.18em;padding:4px 0 8px;border-bottom:3px solid var(--ink);align-self:flex-start;font-variant-numeric:tabular-nums}
.pp{display:flex;align-items:center;gap:8px;font-size:15px;min-width:0;padding:4px 0;border-bottom:1px solid var(--line)}
.pp .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .em{font:20px var(--f-emoji);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2.5px solid;flex:none;background:#fff;position:relative}
.pp .hat{position:absolute;top:-12px;font-size:14px}
.tag{font:500 11px var(--f-mono);color:var(--ink-soft);white-space:nowrap}
.tag.host{background:var(--hi);color:var(--ink);padding:0 5px;border-radius:3px}
.team{font:600 11px var(--f-body);color:#fff;padding:1px 6px;border-radius:3px;white-space:nowrap}
.e{font-family:var(--f-emoji)}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{border:0;border-right:2px solid var(--ink);background:var(--paper);padding:7px 4px;font:600 13px var(--f-body);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.seg button:last-child{border-right:0}
.seg button small{font:500 10px var(--f-mono);color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}.seg button[aria-pressed="true"] small{color:var(--hi)}
.seg button:disabled{cursor:default}
.seg.modes{grid-template-columns:repeat(2,1fr)}.seg.modes button:nth-child(2){border-right:0}.seg.modes button:nth-child(-n+2){border-bottom:2px solid var(--ink)}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:5px 14px;font-size:15px;align-items:center}
.kv b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.kv .sub{font:500 12px var(--f-mono);color:var(--ink-soft);text-align:right;white-space:nowrap}
.kv .who{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{font-size:12.5px;color:var(--ink-soft)}
.wait{font-size:14px;color:var(--ink-soft);text-align:center;padding:8px;border:1.5px dashed var(--line);border-radius:6px}
.err{font-size:13px;color:var(--bad)}
.rec{background:var(--hi);border:2px solid var(--ink);border-radius:6px;padding:6px 10px;font-weight:500;text-align:center}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{border:1.5px solid var(--ink);border-radius:20px;padding:3px 10px;font-size:13px;background:#fff;white-space:nowrap}
.elimbox{border:2px dashed var(--bad);color:var(--bad);border-radius:6px;padding:6px 10px;font-weight:500;text-align:center}
.teamsum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.teamsum div{border:2px solid var(--ink);border-radius:6px;padding:8px;color:#fff;text-align:center;font-weight:500}
.teamsum b{display:block;font:700 24px var(--f-mono)}
kbd{font:600 11px var(--f-mono);border:1.5px solid var(--ink-soft);border-bottom-width:2.5px;border-radius:4px;padding:0 5px;color:var(--ink);background:var(--paper)}
.keys,.items{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:13px;color:var(--ink-soft);align-items:center}
.items .e{font-size:19px;text-align:center}
.items b{color:var(--ink);font-weight:500}
details.more summary{cursor:pointer;font:600 13px var(--f-body);color:var(--ink)}
details.more[open] summary{margin-bottom:8px}
.lv{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13px}
.lv li{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:baseline}
.lv .no{font:700 12px var(--f-mono)}.lv .g{font:600 12px var(--f-mono);color:var(--ink-soft)}
.lv .f{color:var(--ink-soft)}
.podium{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:8px;text-align:center}
.podium div{border:2px solid var(--ink);border-radius:6px 6px 0 0;padding:10px 6px;font-size:14px;min-width:0;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.podium b{display:block;font:700 22px var(--f-mono)}
.podium .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:100%}
.podium .pts{font:700 15px var(--f-mono);font-variant-numeric:tabular-nums}
.podium .e{font-size:28px;display:block}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 6px;text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);border-bottom:1px solid var(--line)}
th{font-size:10.5px;letter-spacing:.08em;color:var(--ink-soft);font-weight:500}
td.nm,th.nm{text-align:left;font-family:var(--f-body);white-space:nowrap}
.tblwrap{overflow-x:auto}
.coins{font:700 18px var(--f-mono);background:var(--hi);border:2px solid var(--ink);border-radius:20px;padding:2px 12px;white-space:nowrap}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.shopitem{border:2px solid var(--line);border-radius:8px;background:#fff;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:500 12px var(--f-body);color:var(--ink)}
.shopitem .e{font-size:28px;height:34px;display:grid;place-items:center}
.shopitem small{font:600 11px var(--f-mono);color:var(--ink-soft)}
.shopitem.owned small{color:var(--ok)}
.shopitem[aria-pressed="true"]{border-color:var(--ink);background:var(--hi)}
.shopitem.locked{opacity:.6}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.ach{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;gap:10px;align-items:flex-start;background:#fff}
.ach .e{font-size:24px;filter:grayscale(1);opacity:.4}
.ach.got{border-color:var(--ink)}.ach.got .e{filter:none;opacity:1}
.ach b{display:block;font-weight:500;font-size:14px}.ach span{font-size:12px;color:var(--ink-soft)}
.daily{border:2px solid var(--ink);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
#tools{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:5}
.tool{height:36px;min-width:36px;padding:0 10px;border:2px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);font:600 13px var(--f-body);cursor:pointer;display:flex;align-items:center;gap:6px}
#reactBar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;gap:6px;z-index:5;align-items:center}
.rb{width:42px;height:42px;border:2px solid var(--ink);border-radius:50%;background:var(--paper);font:22px var(--f-emoji);cursor:pointer;display:grid;place-items:center;padding:0;position:relative}
.rb kbd{position:absolute;bottom:-6px;right:-4px;font-size:9px;padding:0 3px}
.rb.spit{width:auto;border-radius:21px;padding:0 14px;font:600 13px var(--f-body);display:flex;gap:6px}
.rb:disabled{opacity:.4;cursor:default}
#toasts{position:fixed;left:50%;bottom:max(80px,calc(env(safe-area-inset-bottom,0px) + 80px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:6}
.toast{background:var(--ink);color:var(--hi);font:500 14px var(--f-body);padding:7px 14px;border-radius:6px;animation:tin .25s ease-out;white-space:nowrap}
.toast.ach{background:var(--hi);color:var(--ink);border:2px solid var(--ink)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){.btn:hover{transform:none!important}.toast{animation:none}}
</style>
</head>

let AC=null,muted=lsGet('pt-muted')==='1',musicOn=lsGet('pt-music')!=='0';
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){AC=null}return AC;}
function beep(f1,f2,dur,type='square',vol=.04,delay=0){
  if(muted)return;const A=ac();if(!A)return;
  const t=A.currentTime+delay,o=A.createOscillator(),g=A.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(A.destination);o.start(t);o.stop(t+dur+.02);
}
const SFX={
  jump:()=>beep(320,620,.11,'square',.02),spring:()=>beep(180,900,.32,'triangle',.06),shoot:()=>beep(1000,300,.08,'square',.02),
  pick:()=>{beep(660,990,.09,'sine',.06);beep(990,1320,.12,'sine',.05,.08)},star:()=>beep(1200,1800,.08,'sine',.04),
  kill:()=>beep(220,40,.3,'sawtooth',.05),hit:()=>beep(500,200,.1,'square',.04),crack:()=>beep(400,80,.12,'sawtooth',.03),
  hurt:()=>beep(300,60,.5,'sawtooth',.06),jet:()=>beep(90,140,.4,'sawtooth',.03),ink:()=>beep(140,70,.35,'triangle',.07),
  enemyShot:()=>beep(700,250,.12,'triangle',.022),warn:()=>beep(220,220,.12,'square',.03),tick:()=>beep(520,520,.08,'square',.04),
  go:()=>beep(880,880,.25,'square',.05),combo:n=>beep(500+n*120,900+n*150,.15,'square',.04),stomp:()=>beep(200,500,.15,'square',.05),
  pop:()=>beep(900,1200,.05,'sine',.03),
  finish:()=>[523,659,784,1046].forEach((f,i)=>beep(f,f,.18,'square',.05,i*.1))
};
// tiny chiptune: A-minor loop, tempo rises with danger
const MUSIC={next:0,step:0,danger:0};
const NOTE=n=>440*Math.pow(2,(n-69)/12);
const BASS=[45,45,52,45,41,41,48,41,43,43,50,43,40,40,47,40];
const CHORDS=[[57,60,64],[53,57,60],[55,59,62],[52,55,59]];
function musicTick(){
  const A=AC;if(!A||muted||!musicOn||!(S.phase==='play'||S.phase==='countdown')){MUSIC.next=0;return;}
  const bpm=118*(1+MUSIC.danger*.45),dt=60/bpm/4;
  if(!MUSIC.next||MUSIC.next<A.currentTime)MUSIC.next=A.currentTime+.05;
  while(MUSIC.next<A.currentTime+.12){
    const s=MUSIC.step%64,t=MUSIC.next,bar=Math.floor(s/16)%4;
    const tone=(f,d,type,vol)=>{const o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(A.destination);o.start(t);o.stop(t+d+.01);};
    if(s%2===0)tone(NOTE(BASS[(Math.floor(s/2))%16]),dt*1.8,'triangle',.05);
    const ch=CHORDS[bar];if(s%4!==3)tone(NOTE(ch[s%3]+12),dt*.9,'square',.012+MUSIC.danger*.01);
    if(s%8===4){const o=A.createBufferSource(),b=A.createBuffer(1,800,A.sampleRate),d=b.getChannelData(0);for(let i=0;i<800;i++)d[i]=(Math.random()*2-1)*(1-i/800);o.buffer=b;const g=A.createGain();g.gain.value=.03;o.connect(g).connect(A.destination);o.start(t);}
    MUSIC.next+=dt;MUSIC.step++;
  }
}

/* ================= network =================
   Star topology: the host is the authority and relays everyone's state.
   Two transports: direct browser-to-browser (PeerJS/WebRTC with STUN+TURN) and a fallback relay
   through public MQTT-over-WebSocket brokers that pass most NATs and firewalls. */
const QS=new URLSearchParams(location.search);
const BROKERS=QS.get('broker')?[QS.get('broker')]:['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
const NO_P2P=QS.get('nop2p')==='1';
const VER='v3';
const TOPIC=c=>'prygtetrad/'+VER+'/'+c;
const PEER_ID=c=>'prygtetrad-'+VER+'-room'+c;
const PEER_OPTS={debug:0,config:{iceServers:[
  {urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']},
  {urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'},
  {urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}
]}};
const HAS_P2P=typeof Peer!=='undefined'&&!NO_P2P,HAS_MQ=typeof mqtt!=='undefined';
const NET={mode:'none',peer:null,peerOk:false,brokers:[],conns:new Map(),link:null,via:'',myId:'h',cid:'',code:'',lobby:[],states:{},seq:0,lastHost:0,gen:0,ready:HAS_P2P||HAS_MQ};
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
function newCode(){return String(Math.floor(Math.random()*10000)).padStart(4,'0');}
function safeJSON(buf){try{const s=typeof buf==='string'?buf:new TextDecoder().decode(buf);return s?JSON.parse(s):null;}catch(e){return null;}}
function mqPub(cl,topic,obj,retain){try{if(cl&&cl.connected)cl.publish(topic,obj==null?'':JSON.stringify(obj),{qos:0,retain:!!retain});}catch(e){}}
function connectBroker(url,opts){
  return new Promise(res=>{
    if(!HAS_MQ)return res(null);
    let done=false,cl=null;
    try{cl=mqtt.connect(url,{clientId:'pt_'+rid(),clean:true,connectTimeout:7000,reconnectPeriod:2500,keepalive:20,...(opts||{})});}catch(e){return res(null);}
    const t=setTimeout(()=>{if(!done){done=true;try{cl.end(true)}catch(e){}res(null);}},8000);
    cl.on('connect',()=>{if(done)return;done=true;clearTimeout(t);res(cl);});
    cl.on('error',()=>{});
  });
}
function cleanPerson(p){return{id:String(p.id).slice(0,12),n:String(p.n||'').trim().slice(0,12)||'Игрок',c:clampC(p.c),a:clampA(p.a),h:clampH(p.h),tr:clampT(p.tr)};}
function teardown(){
  NET.gen++;
  if(NET.mode==='host'&&NET.code)for(const cl of NET.brokers)mqPub(cl,TOPIC(NET.code)+'/room',null,true);
  try{NET.peer&&NET.peer.destroy()}catch(e){}
  for(const cl of NET.brokers){try{cl.end(true)}catch(e){}}
  NET.peer=null;NET.peerOk=false;NET.brokers=[];NET.conns.clear();NET.link=null;NET.via='';NET.lobby=[];NET.states={};NET.mode='none';NET.code='';
}
addEventListener('pagehide',()=>{if(NET.mode==='host'&&NET.code)for(const cl of NET.brokers)mqPub(cl,TOPIC(NET.code)+'/room',null,true);});

function hostRoom(solo,firstG){
  teardown();NET.mode=solo?'solo':'host';NET.myId='h';
  NET.lobby=[cleanPerson({id:'h',...meInfo()})];
  Gloc={ph:'lobby',ep:0,df:clampD(+(lsGet('pt-diff')??1)),mode:clampM(+lsGet('pt-mode')||0),len:clampL(+(lsGet('pt-len')??1))};
  if(solo){applyG(Gloc);if(firstG)setG(firstG);return;}
  const gen=NET.gen;
  showConnecting('Создаём комнату…');
  let shown=false;const show=()=>{if(!shown&&gen===NET.gen){shown=true;applyG(Gloc);}};
  const open=(attempt)=>{
    const code=newCode();NET.code=code;
    let p2pSettled=!HAS_P2P;
    const startBrokers=()=>BROKERS.forEach(url=>connectBroker(url,{will:{topic:TOPIC(code)+'/room',payload:'',retain:true,qos:0}}).then(cl=>{
      if(!cl)return;if(gen!==NET.gen||NET.code!==code){try{cl.end(true)}catch(e){}return;}
      NET.brokers.push(cl);
      const T=TOPIC(code);
      cl.subscribe(T+'/up');
      const announce=()=>mqPub(cl,T+'/room',{t:Date.now(),v:3},true);announce();
      cl.on('connect',()=>{cl.subscribe(T+'/up');announce();});
      cl.on('message',(topic,buf)=>{if(topic!==T+'/up')return;const d=safeJSON(buf);if(!d||typeof d.cid!=='string')return;hostOnData({kind:'mq',cid:d.cid.slice(0,40),cl},d);});
      show();renderLobbyDynamic();
    }));
    if(HAS_P2P){
      const peer=new Peer(PEER_ID(code),PEER_OPTS);NET.peer=peer;
      peer.on('open',()=>{NET.peerOk=true;if(!p2pSettled){p2pSettled=true;startBrokers();}show();renderLobbyDynamic();});
      peer.on('error',err=>{
        if(err&&err.type==='unavailable-id'&&attempt<5&&!p2pSettled){p2pSettled=true;try{peer.destroy()}catch(e){}open(attempt+1);return;}
        if(!p2pSettled){p2pSettled=true;startBrokers();}
      });
      peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
      peer.on('connection',conn=>{
        conn.on('data',d=>hostOnData({kind:'p2p',conn},d));
        conn.on('close',()=>hostDropBy(e=>e.kind==='p2p'&&e.conn===conn));
        conn.on('error',()=>hostDropBy(e=>e.kind==='p2p'&&e.conn===conn));
      });
      setTimeout(()=>{if(!p2pSettled&&gen===NET.gen&&NET.code===code){p2pSettled=true;startBrokers();}},5000);
    }else startBrokers();
  };
  open(0);
  setTimeout(()=>{if(gen===NET.gen&&!shown&&!NET.brokers.length&&!NET.peerOk){teardown();showMenu('Не получилось создать комнату: нет связи с игровыми серверами. Проверь интернет или VPN и попробуй ещё раз.');}},14000);
}
function entryFor(link){
  for(const [id,e] of NET.conns){if(link.kind==='p2p'&&e.kind==='p2p'&&e.conn===link.conn)return [id,e];if(link.kind==='mq'&&e.kind==='mq'&&e.cid===link.cid)return [id,e];}
  return null;
}
function sendTo(e,obj){
  if(e.kind==='p2p'){try{if(e.conn.open)e.conn.send(obj)}catch(err){}}
  else mqPub(e.cl,TOPIC(NET.code)+'/down',{...obj,to_:e.cid});
}
function broadcast(obj){
  let mq=false;
  for(const [,e] of NET.conns){if(e.kind==='p2p')sendTo(e,obj);else mq=true;}
  if(mq){const s=new Set();for(const [,e] of NET.conns)if(e.kind==='mq'&&!s.has(e.cl)){s.add(e.cl);mqPub(e.cl,TOPIC(NET.code)+'/down',obj);}}
}
function hostOnData(link,d){
  if(!d||typeof d!=='object'||NET.mode!=='host')return;
  const found=entryFor(link);
  if(d.t==='hello'){
    if(found){sendTo(found[1],{t:'welcome',id:found[0]});sendTo(found[1],{t:'lobby',list:NET.lobby});sendTo(found[1],{t:'g',g:Gloc});return;}
    const id='p'+(++NET.seq);
    const person=cleanPerson({...d,id});
    const used=new Set(NET.lobby.map(p=>p.c));
    if(used.has(person.c)){const f=COLORS.findIndex((_,i)=>!used.has(i));if(f>=0)person.c=f;}
    const e={...link,last:Date.now()};NET.conns.set(id,e);NET.lobby.push(person);
    sendTo(e,{t:'welcome',id,c:person.c});
    broadcast({t:'lobby',list:NET.lobby});sendTo(e,{t:'g',g:Gloc});
    toast(AVATARS[person.a]+' '+person.n+' в комнате');SFX.pop();renderLobbyDynamic();
    return;
  }
  if(!found)return;
  const [id,e]=found;e.last=Date.now();
  if(d.t==='s'&&d.s&&typeof d.s==='object')NET.states[id]=d.s;
  else if(d.t==='ev'&&typeof d.k==='string'){const ev={t:'ev',k:d.k.slice(0,12),from:id,to:typeof d.to==='string'?d.to.slice(0,12):'',v:num(d.v)|0};broadcast(ev);onEvent(ev);}
  else if(d.t==='bye')hostDropBy(x=>x===e);
}
function hostDropBy(pred){
  for(const [id,e] of [...NET.conns]){if(!pred(e))continue;
    NET.conns.delete(id);const p=NET.lobby.find(x=>x.id===id);NET.lobby=NET.lobby.filter(x=>x.id!==id);delete NET.states[id];
    broadcast({t:'lobby',list:NET.lobby});if(p)toast(p.n+' вышел');renderLobbyDynamic();}
}
setInterval(()=>{if(NET.mode==='host'){const now=Date.now();hostDropBy(e=>e.kind==='mq'&&now-e.last>15000);}},3000);

function joinRoom(code){
  teardown();NET.mode='client';NET.code=code;NET.cid=rid();
  const gen=NET.gen;
  const fail=msg=>{if(gen!==NET.gen||NET.mode!=='client')return;teardown();showMenu(msg);};
  const useLink=(via,sendFn)=>{if(gen!==NET.gen||NET.link)return false;NET.via=via;NET.link={send:sendFn};NET.lastHost=Date.now();sendFn({t:'hello',...meInfo()});return true;};
  showConnecting('Подключаемся к комнате '+code+'…');
  let mqTried=false;
  const tryRelay=async()=>{
    if(mqTried||NET.link||gen!==NET.gen)return;mqTried=true;
    if(!HAS_MQ){fail('Комната '+code+' не отвечает. Проверь код и что у ведущего открыта страница с игрой.');return;}
    showConnecting('Подключаемся к комнате '+code+' через сервер…');
    for(const url of BROKERS){
      if(NET.link||gen!==NET.gen)return;
      const cl=await connectBroker(url);if(!cl)continue;
      if(gen!==NET.gen||NET.link){try{cl.end(true)}catch(e){}return;}
      const T=TOPIC(code);
      const found=await new Promise(res=>{
        let ok=false;const t=setTimeout(()=>res(ok),5000);
        cl.on('message',(topic,buf)=>{
          if(topic===T+'/room'){const d=safeJSON(buf);if(d&&d.t&&!ok){ok=true;clearTimeout(t);res(true);}return;}
          if(topic===T+'/down'&&NET.via==='mq'&&NET.brokers[0]===cl){const d=safeJSON(buf);if(!d||(d.to_&&d.to_!==NET.cid))return;NET.lastHost=Date.now();clientOnData(d);}
        });
        cl.subscribe([T+'/room',T+'/down']);
      });
      if(found&&gen===NET.gen&&!NET.link){
        NET.brokers=[cl];
        cl.on('connect',()=>cl.subscribe([T+'/room',T+'/down']));
        useLink('mq',o=>mqPub(cl,T+'/up',{...o,cid:NET.cid}));
        return;
      }
      try{cl.end(true)}catch(e){}
    }
    if(!NET.link)fail('Комната '+code+' не найдена. Проверь код и что у ведущего открыта вкладка с игрой.');
  };
  if(HAS_P2P){
    const peer=new Peer(PEER_OPTS);NET.peer=peer;
    const t=setTimeout(()=>{if(!NET.link)tryRelay();},7000);
    peer.on('open',()=>{
      const conn=peer.connect(PEER_ID(code),{reliable:true});
      conn.on('open',()=>{clearTimeout(t);if(!useLink('p2p',o=>{try{conn.open&&conn.send(o)}catch(e){}})){try{conn.close()}catch(e){}}});
      conn.on('data',d=>{if(NET.via!=='p2p')return;NET.lastHost=Date.now();clientOnData(d);});
      conn.on('close',()=>{if(NET.via==='p2p'&&gen===NET.gen)lost();});
    });
    peer.on('error',()=>{clearTimeout(t);if(!NET.link)tryRelay();});
  }else tryRelay();
}
function lost(){if(NET.mode!=='client')return;teardown();world=null;S.phase='menu';showMenu('Связь с ведущим потеряна. Войди по коду ещё раз.');}
function clientOnData(d){
  if(!d||typeof d!=='object')return;
  if(d.t==='welcome'){NET.myId=String(d.id);if(d.c!=null)ME.c=clampC(d.c);}
  else if(d.t==='lobby'&&Array.isArray(d.list)){NET.lobby=d.list.slice(0,40).map(cleanPerson);renderLobbyDynamic();}

function hostEndLevel(){

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let world=null;
const remote=new Map(),reacts=new Map();
function gen(L,D,seed,slot,n,king){
  const r=rng(seed),R=(a,b)=>a+r()*(b-a);
  const plats=[{x:0,y:START_Y,w:W,type:'start'}],foes=[],holes=[],doodles=[],stars=[];
  const goalM=king?L.goal*4:L.goal;
  const goalY=START_Y-goalM*10;let y=START_Y;
  const gapA=L.gap[0]+D.gap,gapB=Math.min(150,L.gap[1]+D.gap);
  const mk=(x,y)=>{
    const w=L.pw,k=r();let type=k<L.moving?'moving':k<L.moving+L.vanish?'vanish':'normal';
    if(START_Y-y<240)type='normal';
    const p={x,y,w,type};
    if(type==='moving')p.dx=(r()<.5?-1:1)*R(L.mv*.6,L.mv)*D.speed;
    if(type==='normal'&&r()<L.spring)p.spring=R(10,w-24);
    else if(type!=='vanish'&&START_Y-y>300){for(const it in L.items){if(r()<L.items[it]){p.item=it;break;}}}
    if(!p.item&&r()<L.stars)stars.push({x:x+w/2+R(-20,20),y:y-R(40,95)});
    plats.push(p);
  };
  while(y>goalY+90){
    y-=R(gapA,gapB);
    const cnt=L.per[0]+(r()<.5?L.per[1]-L.per[0]:0);
    const seg=(W-90)/cnt;
    for(let k=0;k<cnt;k++)mk(50+seg*k+R(0,Math.max(4,seg-L.pw)),y+R(-10,10));
    if(r()<L.breaking)plats.push({x:R(50,W-L.pw-40),y:y+R(26,44),w:L.pw,type:'breaking'});
    if(START_Y-y>800&&y>goalY+350){
      for(const kind in L.foes){
        if(r()<L.foes[kind]*D.foe){
          const bx=R(110,W-110),by=y-R(55,80);
          foes.push({type:kind,bx,by,x:bx,y:by,t:r()*6,amp:R(40,140),sp:R(.02,.035),hp:FOES[kind].hp,cd:R(.5,2),state:'idle',vx:0,vy:0,dead:false,hitT:0});
          break;
        }
      }
    }
    if(L.hole&&START_Y-y>1200&&y>goalY+400&&r()<L.hole)holes.push({x:R(140,W-140),y:y-R(40,60),r:26,t:r()*6});
  }
  if(L.boss&&!king){const hp=Math.round(FOES.boss.hp*(D.foe>1?1.4:D.foe<1?.7:1));foes.push({type:'boss',bx:W/2,by:goalY+230,x:W/2,y:goalY+230,t:0,amp:360,sp:.012,hp,maxHp:hp,cd:2,state:'idle',vx:0,vy:0,dead:false,hitT:0});}
  if(!king)plats.push({x:0,y:goalY,w:W,type:'goal'});
  const span=(START_Y-goalY)*.5+H*2;
  for(let yy=H;yy>-span;yy-=R(110,220))doodles.push({x:R(70,W-60),y:yy,k:Math.floor(r()*7),rot:R(-.4,.4),s:R(.8,1.4),c:Math.floor(r()*7)});
  const x=slot<0?W/2:60+(W-120)*(slot+.5)/Math.max(1,n);
  const floodBase=king?Math.max(.55,L.flood)*Math.max(.8,D.flood):L.flood*D.flood;
  return{plats,foes,holes,doodles,stars,goalY,goalM,king,camY:0,t:0,pellets:[],shots:[],parts:[],pops:[],splats:[],wind:0,
    flood:START_Y+320,floodSpeed:floodBase,lastWarn:0,giftT:6,
    p:{x,y:START_Y,vx:0,vy:0,dead:false,out:slot<0,fin:0,finT:0,best:0,squash:0,jet:0,boots:0,shield:0,magnet:0,rev:0,ice:0,torn:0,tdir:1,cd:0,spin:0,
       stars:0,kp:0,kills:0,combo:0,maxCombo:0,lastKill:-9,items:0,stomps:0,bossKill:0,stompCd:0,trailT:0},spectator:slot<0};
}

    case 'tornado':if(!act)return;if(blockedByShield(who,'смерч'))return;world.p.torn=4;world.p.tdir=Math.random()<.5?-1:1;S.shake=6;SFX.warn();toast('🌪️ '+who+' запустил в тебя смерч!');break;

function step(now){
  const dt=Math.min(50,now-(S.last||now));S.last=now;
  if(S.phase==='countdown'){S.cd-=dt/1000;const n=Math.ceil(S.cd-.2);if(n!==S.lastCd){S.lastCd=n;if(n>0)SFX.tick();else SFX.go();}
    if(S.cd<=0){S.phase='play';if(world&&!world.spectator)world.p.vy=JUMP;renderReactBar();}}
  if(S.phase==='play'&&world){let f=dt/16.667;while(f>0){const s=Math.min(1,f);update(s);f-=s;}}
  if(world)smoothRemotes();
  draw();
  requestAnimationFrame(step);
}

  PROF.coins+=coins;rewardMsg=`+${coins} 🪙 за уровень`;
  stat('kills',r.k);stat('stars',r.stars);if(r.fin)stat('finishes');statMax('maxCombo',P.maxCombo);stat('stomps',P.stomps);
  if(P.bossKill){stat('boss');if(D===2)stat('bossHard');}
  if(r.fin&&P.items===0)stat('pure');
  if(modeOf(g)==='king')statMax('king',r.m);
  if(g.daily)stat('daily');
  const key='pt-rec-'+(g.daily?'daily'+g.daily:D+'-'+modeOf(g)+'-'+g.lvl);const prev=num(lsGet(key));
  if(r.pts>prev){lsSet(key,r.pts);recMsg=prev>0?`🏆 Новый личный рекорд: ${r.pts} (был ${prev})`:`🏆 Первый рекорд здесь: ${r.pts}`;}else recMsg=`Твой рекорд здесь: ${prev}`;
  saveProf();checkAch();
  if(g.daily)submitDaily(g.daily,r.pts);
}
function highlights(res,ro){
  const out=[];const best=(f)=>{let bi=-1,bv=0;res.forEach((r,i)=>{if(r&&!r.gone&&f(r)>bv){bv=f(r);bi=i;}});return bi>=0?[ro[bi],bv]:null;};
  const st=best(r=>num(r.stars));if(st)out.push(`⭐ Звездочёт: ${AVATARS[st[0].a]} ${esc(st[0].n)} · ${st[1]}`);
  const k=best(r=>num(r.k));if(k)out.push(`🎯 Снайпер: ${AVATARS[k[0].a]} ${esc(k[0].n)} · ${k[1]}`);
  const m=best(r=>num(r.m));if(m)out.push(`🧗 Выше всех: ${AVATARS[m[0].a]} ${esc(m[0].n)} · ${m[1]} м`);
  return out;
}
function showResults(g){
  const ro=rosterOf(g),L=LEVELS[clampI(g.lvl,LEVELS.length)],res=Array.isArray(g.res)?g.res:[],mode=modeOf(g),el=elimOf(g),seq=seqOf(g),si=clampI(g.si,8);
  rewardForLevel(g,res,ro);
  const rows=ro.map((r,i)=>({r,x:res[i]||{m:0,pl:0,pts:0,stars:0,kp:0,k:0}})).filter(x=>!x.x.gone).sort((a,b)=>num(b.x.pts)-num(a.x.pts));
  const top=rows[0],last=si>=seq.length-1;
  const alive=ro.filter(r=>!el.includes(r.id)).length;
  const willEnd=last||(mode==='elim'&&alive<=1);
  const outP=g.out?ro.find(r=>r.id===g.out):null;
  let teamHTML='';if(mode==='teams'){const lv=[0,0],tt=[0,0];ro.forEach((r,i)=>{lv[r.tm]+=num(res[i]&&res[i].pts);tt[r.tm]+=num(Array.isArray(g.tot)?g.tot[i]:0);});
    teamHTML=`<div class="teamsum">${TEAM.map((t,i)=>`<div style="background:${t.color}">${t.name}<b>+${lv[i]}</b>всего ${tt[i]}</div>`).join('')}</div>`;}
  const hl=highlights(res,ro);
  showUI(`<div class="card" style="max-width:600px">
    <div class="eyebrow">${g.daily?'Вызов дня · ':''}Уровень ${si+1} из ${seq.length} · ${esc(L.name)} · ${MODES[clampM(g.mode)].name} · ${DIFFS[clampD(g.df)].name}</div>
    <h2>${top?(top.x.pl===1&&mode!=='king'?AVATARS[top.r.a]+' '+esc(top.r.n)+' первым на финише':'Больше всех очков: '+AVATARS[top.r.a]+' '+esc(top.r.n)):'Уровень окончен'}</h2>
    ${outP?`<div class="elimbox">❌ Вылетает из турнира: ${AVATARS[outP.a]} ${esc(outP.n)}</div>`:''}
    ${teamHTML}
    <div class="kv">${rows.map(({r,x})=>`<span class="who"><span class="e">${AVATARS[r.a]}</span>${esc(r.n)}${r.id===NET.myId?' (ты)':''}</span><span class="sub">${num(x.m)} м · ⭐${num(x.stars)} · 💥${num(x.kp)}${x.pl?` · ${x.pl} место`:''}</span><b>+${num(x.pts)}</b>`).join('')}</div>
    ${hl.length&&ro.length>1?`<div class="badges">${hl.map(h=>`<span class="badge">${h}</span>`).join('')}</div>`:''}
    ${rewardMsg||recMsg?`<div class="${recMsg.startsWith('🏆')?'rec':'hint'}">${esc([rewardMsg,recMsg].filter(Boolean).join(' · '))}</div>`:''}
    ${g.daily?`<div class="daily"><b>📅 Таблица вызова дня</b><div id="dailyTable" class="hint">Загружаем общую таблицу…</div></div>`:standingsTable(g)}
    ${isHost()?(g.daily?`<div class="row"><button class="btn" data-primary id="nextBtn">Ещё попытка</button><button class="btn ghost" id="menuBtn">В меню</button></div>`
      :`<button class="btn" data-primary id="nextBtn">${willEnd?'Итоги турнира':'Уровень '+(si+2)+': '+esc(LEVELS[seq[si+1]].name)}</button>`):`<div class="wait">Ведущий запустит следующий уровень · жми 1–5 для реакций</div>`}
  </div>`);
  const b=$('#nextBtn');if(b)b.onclick=hostNext;const mb=$('#menuBtn');if(mb)mb.onclick=()=>{teardown();showMenu();};
  if(g.daily)loadDaily(g.daily);
}
function standingsTable(g){
  const ro=rosterOf(g),h=Array.isArray(g.h)?g.h:[],tot=Array.isArray(g.tot)?g.tot:[],seq=seqOf(g),el=elimOf(g);
  const rows=ro.map((r,i)=>({r,h:Array.isArray(h[i])?h[i]:[],t:num(tot[i])})).sort((a,b)=>b.t-a.t);
  return `<div class="tblwrap"><table><tr><th class="nm">ОБЩИЙ СЧЁТ</th>${seq.map((l,i)=>`<th title="${esc(LEVELS[l].name)}">У${i+1}</th>`).join('')}<th>Σ</th></tr>${rows.map(x=>`<tr style="${el.includes(x.r.id)?'opacity:.45':''}"><td class="nm"><span class="e">${AVATARS[x.r.a]}</span> ${esc(x.r.n)}${modeOf(g)==='teams'?` <span class="team" style="background:${TEAM[x.r.tm].color}">${TEAM[x.r.tm].name[0]}</span>`:''}</td>${seq.map((_,l)=>x.h[l]!=null?`<td>${num(x.h[l])}</td>`:'<td style="color:var(--line)">·</td>').join('')}<td style="font-weight:700">${x.t}</td></tr>`).join('')}</table></div>`;
}
let finalRewardEp=-1;
function showFinal(g){
  const ro=rosterOf(g),tot=Array.isArray(g.tot)?g.tot:[],mode=modeOf(g),el=elimOf(g);
  const r=ro.map((x,i)=>({...x,total:num(tot[i])}));
  if(mode==='elim')r.sort((a,b)=>{const ia=el.indexOf(a.id),ib=el.indexOf(b.id);const ra=ia<0?1e9:ia,rb=ib<0?1e9:ib;return rb-ra||b.total-a.total;});
  else r.sort((a,b)=>b.total-a.total);
  let head='',teamHTML='';
  if(mode==='teams'){const tt=[0,0];r.forEach(p=>tt[p.tm]+=p.total);const w=tt[0]===tt[1]?-1:tt[0]>tt[1]?0:1;
    head=w<0?'Ничья команд!':`Победили ${TEAM[w].name}!`;teamHTML=`<div class="teamsum">${TEAM.map((t,i)=>`<div style="background:${t.color}">${t.name}<b>${tt[i]}</b></div>`).join('')}</div>`;
    if(finalRewardEp!==g.ep){finalRewardEp=g.ep;const me=r.find(p=>p.id===NET.myId);if(me&&me.tm===w){stat('wins');PROF.coins+=30;toast('🏆 Твоя команда победила · +30 🪙');saveProf();checkAch();}}}
  else{head=r[0]?AVATARS[r[0].a]+' '+esc(r[0].n)+(mode==='elim'?' — последний выживший':' — чемпион тетради'):'Турнир окончен';
    if(finalRewardEp!==g.ep){finalRewardEp=g.ep;if(r[0]&&r[0].id===NET.myId&&ro.length>1){stat('wins');if(mode==='elim')stat('elimWins');PROF.coins+=50;toast('🏆 Победа в турнире · +50 🪙');saveProf();checkAch();}}}
  const slot=(p,h,place)=>p?`<div style="min-height:${h}px;background:${COLORS[p.c]}"><span class="e">${AVATARS[p.a]}</span><b>${place}</b><span class="n">${esc(p.n)}</span><span class="pts">${p.total}</span></div>`:'<div style="border:0"></div>';
  SFX.finish();
  showUI(`<div class="card">
    <div class="eyebrow">Итог турнира · ${MODES[clampM(g.mode)].name} · ${DIFFS[clampD(g.df)].name}</div>
    <h2>${head}</h2>
    ${teamHTML}
    <div class="podium">${slot(r[1],160,2)}${slot(r[0],196,1)}${slot(r[2],140,3)}</div>
    <div class="kv">${r.slice(3).map((p,k)=>`<span class="who"><span class="e">${AVATARS[p.a]}</span>${k+4}. ${esc(p.n)}</span><span></span><b>${p.total}</b>`).join('')}</div>
    ${isHost()?`<div class="row"><button class="btn" data-primary id="againBtn">Реванш</button><button class="btn ghost" id="lobbyBtn">В лобби</button></div>`:`<div class="wait">Ведущий решает: реванш или лобби</div>`}
  </div>`);
  const a=$('#againBtn');if(a)a.onclick=hostRematch;const l=$('#lobbyBtn');if(l)l.onclick=hostLobby;
}

/* daily table through the relay broker (retained messages, one per player per day) */
let dailyCl=null;
async function dailyBroker(){if(dailyCl&&dailyCl.connected)return dailyCl;for(const url of BROKERS){const cl=await connectBroker(url);if(cl){dailyCl=cl;return cl;}}return null;}
async function submitDaily(day,pts){
  const key='pt-daily-best-'+day,prev=num(lsGet(key));if(pts<=prev)return;lsSet(key,pts);
  const cl=await dailyBroker();if(cl)mqPub(cl,TOPIC('daily/'+day+'/'+PROF.uid),{n:ME.n.slice(0,12),a:ME.a,s:pts,t:Date.now()},true);
}
async function loadDaily(day){
  const box=()=>$('#dailyTable');
  const cl=await dailyBroker();const mine=num(lsGet('pt-daily-best-'+day));
  if(!cl){if(box())box().textContent=`Общая таблица недоступна. Твой лучший результат сегодня: ${mine}`;return;}
  const rows=new Map();const T=TOPIC('daily/'+day+'/');
  const onMsg=(topic,buf)=>{if(!topic.startsWith(T))return;const d=safeJSON(buf);if(!d)return;const s=num(d.s);if(s<=0||s>60000)return;rows.set(topic.slice(T.length),{n:String(d.n||'Игрок').slice(0,12),a:clampA(d.a),s,me:topic.endsWith('/'+PROF.uid)});};
  cl.on('message',onMsg);cl.subscribe(T+'+');
  setTimeout(()=>{cl.removeListener('message',onMsg);try{cl.unsubscribe(T+'+')}catch(e){}
    const b=box();if(!b)return;const list=[...rows.values()].sort((a,b)=>b.s-a.s);
    if(!list.length){b.textContent=`Пока никто не записался. Твой лучший результат: ${mine}`;return;}
    const myRank=list.findIndex(x=>x.me)+1;
    b.innerHTML=`<div class="kv">${list.slice(0,10).map((x,i)=>`<span class="who" style="${x.me?'font-weight:700':''}">${i+1}. <span class="e">${AVATARS[x.a]}</span>${esc(x.n)}${x.me?' (ты)':''}</span><span></span><b>${x.s}</b>`).join('')}</div>${myRank>10?`<div class="hint">Ты на ${myRank} месте из ${list.length}</div>`:`<div class="hint">Игроков сегодня: ${list.length}</div>`}`;
  },3000);
}

/* ================= boot ================= */
showMenu();
</script>
